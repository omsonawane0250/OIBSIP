<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter | Om Sonawane</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="converter-card">

            <div class="badge">
                🌡️ Smart Temperature Tool
            </div>

            <h1>
                Temperature<br>
                <span>Converter.</span>
            </h1>

            <p class="intro">
                Convert temperatures between Celsius, Fahrenheit and
                Kelvin quickly and accurately.
            </p>


            <!-- Input Section -->

            <div class="form-group">

                <label for="temperature">
                    Temperature Value
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter temperature"
                    step="any"
                >

            </div>


            <div class="form-group">

                <label for="unit">
                    Input Unit
                </label>

                <select id="unit">

                    <option value="celsius">
                        Celsius (°C)
                    </option>

                    <option value="fahrenheit">
                        Fahrenheit (°F)
                    </option>

                    <option value="kelvin">
                        Kelvin (K)
                    </option>

                </select>

            </div>


            <!-- Convert Button -->

            <button id="convertBtn" class="convert-btn">
                Convert Temperature →
            </button>


            <!-- Error Message -->

            <p id="errorMessage" class="error-message"></p>


            <!-- Results -->

            <section id="results" class="results hidden">

                <h2>Converted Results</h2>

                <div class="result-grid">

                    <div class="result-card">
                        <span class="result-label">
                            Celsius
                        </span>

                        <strong id="celsiusResult">
                            —
                        </strong>
                    </div>


                    <div class="result-card">
                        <span class="result-label">
                            Fahrenheit
                        </span>

                        <strong id="fahrenheitResult">
                            —
                        </strong>
                    </div>


                    <div class="result-card">
                        <span class="result-label">
                            Kelvin
                        </span>

                        <strong id="kelvinResult">
                            —
                        </strong>
                    </div>

                </div>

            </section>


            <p class="footer-note">
                Built with HTML, CSS & Vanilla JavaScript
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
